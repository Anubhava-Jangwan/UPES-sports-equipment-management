version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: upes_sports_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-upes_sports_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sports_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-upes_sports_db}
    volumes:
      - upes_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-upes_sports_admin} -d ${POSTGRES_DB:-upes_sports_db}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: upes_sports_server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-upes_sports_admin}:${POSTGRES_PASSWORD:-sports_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-upes_sports_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_sports_management_upes_2026}
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    container_name: upes_sports_client
    restart: always
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  upes_prod_pgdata:
    driver: local
