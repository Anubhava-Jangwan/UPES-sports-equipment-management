version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: upes_sports_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-upes_sports_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sports_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-upes_sports_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - upes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-upes_sports_admin} -d ${POSTGRES_DB:-upes_sports_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  upes_pgdata:
    driver: local
